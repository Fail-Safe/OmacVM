<!doctype html><meta charset=utf-8><title>scroll load</title>
<style>
body{font:16px/1.5 sans-serif;margin:0 auto;max-width:1100px;background:#f4f1ea}
.card{margin:16px;padding:16px;border-radius:14px;background:linear-gradient(135deg,#fff,#e9e3ff);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.card canvas{width:100%;height:180px;border-radius:10px}
h2{margin:.2em 0}
</style>
<div id=c></div>
<script>
// A long feed (text, shadows, gradients, canvases) that scrolls itself: the raster and
// compositor work of a person scrolling a heavy page, with new content painted all the time.
const c=document.getElementById('c');
let n=0;
function add(k){for(let i=0;i<k;i++,n++){const d=document.createElement('div');d.className='card';
 d.innerHTML='<h2>Item '+n+'</h2><p>'+'Lorem ipsum dolor sit amet, consectetur adipiscing elit. '.repeat(6+n%5)+'</p>';
 const cv=document.createElement('canvas');cv.width=1000;cv.height=180;const g=cv.getContext('2d');
 for(let j=0;j<60;j++){g.fillStyle='hsl('+((n*37+j*11)%360)+',70%,60%)';g.beginPath();g.arc(Math.random()*1000,Math.random()*180,10+Math.random()*40,0,7);g.fill();}
 d.appendChild(cv);c.appendChild(d);}}
add(60);
let dir=1;
function step(){window.scrollBy(0,dir*14);
 if(window.innerHeight+window.scrollY>=document.body.scrollHeight-50){ if(n<1500) add(30); else dir=-1;}
 if(window.scrollY<=0) dir=1;
 requestAnimationFrame(step);}
requestAnimationFrame(step);
</script>
